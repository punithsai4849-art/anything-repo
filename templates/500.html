{% extends 'base.html' %}

{% block title %}500 - Server Error | anything...{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 1rem;">
  <div style="max-width: 520px; background: var(--glass-card); backdrop-filter: blur(20px); border: 2.5px solid #111; border-radius: var(--radius-xl); box-shadow: var(--shadow-brutal-lg); padding: 3.5rem 2rem;">
    <div style="font-size: 5rem; font-weight: 900; line-height: 1; letter-spacing: -3px; margin-bottom: 1rem; color: #FF4433;">500</div>
    <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -0.5px;">Something went wrong</h1>
    <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
      An unexpected error occurred while processing your request. Our system logs have captured the event.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="{% url 'home' %}" class="btn btn-primary btn-md">Back to Home</a>
      <a href="javascript:location.reload()" class="btn btn-secondary btn-md">Retry</a>
    </div>
  </div>
</div>
{% endblock %}
