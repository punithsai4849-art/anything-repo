{% extends 'base.html' %}

{% block title %}Create Account — anything...{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3.5rem; max-width: 460px;">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <a href="{% url 'home' %}" style="display: inline-block; font-size: 2.25rem; font-weight: 900; letter-spacing: -1.5px; text-decoration: none; color: #111; margin-bottom: 0.75rem;">anything<span style="color: var(--primary);">...</span></a>
    <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">Join anything...</h1>
    <p class="text-secondary" style="font-size: 0.95rem;">Rate, review, evaluate & contribute to the universal index</p>
  </div>

  <div style="background: var(--glass-card); backdrop-filter: blur(20px); border: 2.5px solid #111; border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-brutal-lg);">
    <form action="{% url 'register' %}" method="POST">
      {% csrf_token %}

      
      <div class="form-group">
        <label class="form-label" for="reg_username">Username *</label>
        <input type="text" name="username" id="reg_username" class="form-control" placeholder="choose_a_username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_email">Email Address *</label>
        <input type="email" name="email" id="reg_email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_password">Password *</label>
        <input type="password" name="password" id="reg_password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_password_confirm">Confirm Password *</label>
        <input type="password" name="password_confirm" id="reg_password_confirm" class="form-control" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btnRegisterSubmit">
        Create Cineast Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="{% url 'login' %}" style="color: var(--cineast-primary); font-weight: 600;">Sign in</a>
    </div>
  </div>

</div>
{% endblock %}
