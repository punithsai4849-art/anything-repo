{% extends 'base.html' %}

{% block title %}Sign In — anything...{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 4rem; max-width: 440px;">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <a href="{% url 'home' %}" style="display: inline-block; font-size: 2.25rem; font-weight: 900; letter-spacing: -1.5px; text-decoration: none; color: #111; margin-bottom: 0.75rem;">anything<span style="color: var(--primary);">...</span></a>
    <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">Sign In</h1>
    <p class="text-secondary" style="font-size: 0.95rem;">Enter your credentials to continue</p>
  </div>

  <div style="background: var(--glass-card); backdrop-filter: blur(20px); border: 2.5px solid #111; border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-brutal-lg);">
    <form action="{% url 'login' %}" method="POST">
      {% csrf_token %}

      
      <div class="form-group">
        <label class="form-label" for="id_username">Username or Email</label>
        <input type="text" name="username" id="id_username" class="form-control" placeholder="username or you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btnLoginSubmit">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="{% url 'register' %}" style="color: var(--cineast-primary); font-weight: 600;">Sign up</a>
    </div>
  </div>

</div>
{% endblock %}
