{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile — Cineast{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; max-width: 540px;">
  
  <div style="margin-bottom: 2rem;">
    <a href="{% url 'user_profile' user.username %}" style="font-size: 0.9rem; color: var(--cineast-primary); font-weight: 600;">← Back to Profile</a>
    <h1 style="font-size: 2.25rem; margin-top: 0.5rem;">Edit Profile</h1>
    <p class="text-secondary">Update your public biography and avatar</p>
  </div>

  <div style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow-sm);">
    <form action="{% url 'edit_profile' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea name="bio" class="form-control" rows="4" placeholder="Tell the cinema community about your favorite directors, genres, or film philosophy...">{{ profile.bio }}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Profile Avatar</label>
        {% if profile.avatar %}
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
          <img src="{{ profile.avatar.url }}" alt="{{ user.username }}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;">
          <span class="text-muted" style="font-size: 0.85rem;">Current avatar</span>
        </div>
        {% endif %}
        <input type="file" name="avatar" accept="image/*" class="form-control">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 2rem;">
        <a href="{% url 'user_profile' user.username %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" id="btnSaveProfile">Save Changes</button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
